<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate Help Desk Bot</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            background: radial-gradient(circle at 20% 0%, #1e2947 0%, #0b1120 55%, #05070d 100%);
            color: #e2e8f0;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.2rem;
            color: #f1f5f9;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        header p {
            color: #94a3b8;
            font-size: 0.98rem;
            max-width: 480px;
            margin: 0 auto;
            line-height: 1.5;
        }

        .card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            border-color: rgba(79, 124, 255, 0.4);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
        }

        .card-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f7cff, #6366f1);
            color: white;
            font-size: 1.1rem;
            margin-bottom: 12px;
        }

        .card h2 {
            font-size: 1.15rem;
            color: #f1f5f9;
            margin: 0 0 16px 0;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 4px;
            margin-top: 12px;
            font-weight: 600;
        }

        label:first-of-type {
            margin-top: 0;
        }

        input[type="text"] {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #334155;
            border-radius: 10px;
            font-size: 0.95rem;
            background-color: rgba(15, 23, 42, 0.8);
            color: #e2e8f0;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="text"]::placeholder {
            color: #64748b;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #4f7cff;
            box-shadow: 0 0 0 3px rgba(79, 124, 255, 0.2);
        }

        .hint {
            font-size: 0.78rem;
            color: #64748b;
            margin-top: 4px;
            font-style: italic;
        }

        button {
            margin-top: 18px;
            background: linear-gradient(135deg, #4f7cff, #3b63d6);
            color: white;
            border: none;
            padding: 11px 22px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(79, 124, 255, 0.35);
            filter: brightness(1.08);
        }

        button:active {
            transform: translateY(0);
        }

        footer {
            text-align: center;
            color: #475569;
            font-size: 0.8rem;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Corporate Help Desk Bot</h1>
            <p>Bem-vindo ao suporte corporativo! Pergunte, abra ou consulte chamados de forma rápida e simples.</p>
        </header>

        <div class="card">
            <div class="card-icon">💬</div>
            <h2>Fazer uma pergunta</h2>
            <form method="POST" action="/perguntar">
                <label for="pergunta">Digite sua pergunta</label>
                <input type="text" id="pergunta" name="pergunta" placeholder="Ex: esqueci minha senha">
                <button type="submit">Perguntar</button>
            </form>
        </div>

        <div class="card">
            <div class="card-icon">📩</div>
            <h2>Abrir chamado</h2>
            <form method="POST" action="/abrir-chamado">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome completo">

                <label for="departamento">Departamento</label>
                <input type="text" id="departamento" name="departamento" placeholder="Ex: TI, RH, Comercial">

                <label for="categoria">Categoria</label>
                <input type="text" id="categoria" name="categoria" placeholder="Ex: Software, Impressora">

                <label for="descricao">Descrição</label>
                <input type="text" id="descricao" name="descricao" placeholder="Descreva o problema">

                <button type="submit">Abrir Chamado</button>
            </form>
        </div>

        <div class="card">
            <div class="card-icon">🔍</div>
            <h2>Consultar chamado</h2>
            <form method="POST" action="/consultar-chamado">
                <label for="protocolo">Protocolo</label>
                <input type="text" id="protocolo" name="protocolo" placeholder="Ex: 8 ou TICKET-0008">
                <p class="hint">Dica: digite apenas o número ou o protocolo completo</p>
                <button type="submit">Consultar</button>
            </form>
        </div>

        <footer>
            Corporate Help Desk Bot — projeto desenvolvido em Python
        </footer>
    </div>
</body>
</html>
