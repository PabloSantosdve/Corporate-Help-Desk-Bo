<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate Help Desk Bot</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 50%, #dbeafe 100%);
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            padding: 32px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(30, 58, 95, 0.1);
        }

        .card-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            font-size: 1.3rem;
            margin-bottom: 14px;
        }

        .icon-sucesso {
            background: #dcfce7;
        }

        .icon-erro {
            background: #fee2e2;
        }

        h1 {
            font-size: 1.2rem;
            color: #1e3a5f;
            margin: 0 0 16px 0;
        }

        .conteudo {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #334155;
        }

        .conteudo strong {
            color: #1e3a5f;
        }

        a.voltar {
            display: inline-block;
            margin-top: 24px;
            background: linear-gradient(135deg, #2e6ff2, #1d54c9);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: transform 0.15s ease;
        }

        a.voltar:hover {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-icon {{ 'icon-erro' if erro else 'icon-sucesso' }}">
            {{ '⚠️' if erro else '✅' }}
        </div>
        <h1>{{ titulo }}</h1>
        <div class="conteudo">{{ conteudo | safe }}</div>
        <a href="/" class="voltar">← Voltar ao início</a>
    </div>
</body>
</html>
