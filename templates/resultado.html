<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate Help Desk Bot</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            background: radial-gradient(circle at 20% 0%, #1e2947 0%, #0b1120 55%, #05070d 100%);
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 16px;
            padding: 32px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        .card-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            font-size: 1.3rem;
            margin-bottom: 14px;
        }

        .icon-sucesso {
            background: rgba(34, 197, 94, 0.15);
        }

        .icon-erro {
            background: rgba(239, 68, 68, 0.15);
        }

        h1 {
            font-size: 1.2rem;
            color: #f1f5f9;
            margin: 0 0 16px 0;
        }

        .conteudo {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #cbd5e1;
        }

        .conteudo strong {
            color: #f1f5f9;
        }

        a.voltar {
            display: inline-block;
            margin-top: 24px;
            background: linear-gradient(135deg, #4f7cff, #3b63d6);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: transform 0.15s ease, filter 0.15s ease;
        }

        a.voltar:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-icon {{ 'icon-erro' if erro else 'icon-sucesso' }}">
            {{ '⚠️' if erro else '✅' }}
        </div>
        <h1>{{ titulo }}</h1>
        <div class="conteudo">{{ conteudo | safe }}</div>
        <a href="/" class="voltar">← Voltar ao início</a>
    </div>
</body>
</html>
